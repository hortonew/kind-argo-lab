# ServiceAccount used by Sensors in this namespace to create Workflows in
# the `argo` namespace. Referenced by:
#   - charts/argo-events/templates/sensor-workflow-trigger.yaml
#   - charts/argo-events/templates/eventsource-alertmanager.yaml (sensor)
#   - charts/calendar-event-demo/templates/all.yaml
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: operate-workflow-sa
  namespace: argo-events
---
# Permission for Sensors to create Workflows in the `argo` namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: operate-workflow
  namespace: argo
rules:
  - apiGroups: [argoproj.io]
    resources: [workflows, workflowtemplates, cronworkflows, clusterworkflowtemplates]
    verbs: [get, list, create, patch, update, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: operate-workflow
  namespace: argo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: operate-workflow
subjects:
  - kind: ServiceAccount
    name: operate-workflow-sa
    namespace: argo-events
