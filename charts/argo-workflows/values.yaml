argo-workflows:
  namespaceOverride: argo
  controller:
    workflowNamespaces:
    - argo
    # Keep recent runs per outcome bucket; older Workflows are
    # garbage-collected by the controller regardless of their TTL.
    # Bumped from 1 → 20 so concurrent demos (calendar tick every 30s + ad-hoc
    # tests) don't evict each other before assertions run.
    retentionPolicy:
      completed: 5
      failed: 5
      errored: 5
  server:
    authModes:
    - server
  workflow:
    serviceAccount:
      create: true
      name: argo-workflow
  useStaticCredentials: true

workflowTemplate:
  imageBuild:
    sourceImage: nginx:stable-alpine
    targetImage: localhost:5001/demo-app:v3
