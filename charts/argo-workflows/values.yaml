argo-workflows:
  namespaceOverride: argo
  controller:
    workflowNamespaces:
      - argo
    # Keep only the most recent run per outcome bucket; older Workflows are
    # garbage-collected by the controller regardless of their TTL.
    retentionPolicy:
      completed: 1
      failed: 1
      errored: 1
  server:
    authModes:
      - server
  workflow:
    serviceAccount:
      create: true
      name: argo-workflow
  useStaticCredentials: true

workflowTemplate:
  imageBuild:
    sourceImage: nginx:stable-alpine
    targetImage: localhost:5001/demo-app:v3
