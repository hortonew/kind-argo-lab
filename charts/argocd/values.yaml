rolloutHealthCheck: |
  hs = {}
  if obj.status ~= nil and obj.status.phase ~= nil then
    if obj.status.phase == "Healthy" then
      hs.status = "Healthy"
      hs.message = "Rollout is healthy"
      return hs
    end
  end
  hs.status = "Progressing"
  hs.message = "Waiting for rollout to become healthy"
  return hs

notifications:
  triggerOnSyncSucceeded: |
    - when: app.status.operationState.phase in ['Succeeded']
      send: [app-sync-log]
  triggerOnSyncFailed: |
    - when: app.status.operationState.phase in ['Error', 'Failed']
      send: [app-sync-log, app-sync-failed-alert]
  templateAppSyncLog: |
    message: Application {{.app.metadata.name}} sync state: {{.app.status.sync.status}}
  templateAppSyncFailedAlert: |
    alertmanager:
      labels:
        alertname: ArgoCDSyncFailed
        severity: warning
        application: {{.app.metadata.name}}
        namespace: {{.app.metadata.namespace}}
      annotations:
        summary: "ArgoCD sync failed for {{.app.metadata.name}}"
        description: "Application {{.app.metadata.name}} is in {{.app.status.sync.status}} state"
