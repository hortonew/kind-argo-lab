{{- if .Values.analysis.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: demo-prometheus-up
  namespace: demo
spec:
  metrics:
    - name: prometheus-up
      interval: 10s
      count: 3
      successCondition: "result[0] >= 1"
      failureLimit: 1
      provider:
        prometheus:
          address: http://prometheus-server.monitoring.svc
          query: |
            up{job="prometheus"}
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: demo-rollout-analysis
  namespace: demo
spec:
  replicas: {{ .Values.analysis.replicas }}
  selector:
    matchLabels:
      app: demo-app-analysis
  strategy:
    canary:
      steps:
        - setWeight: 25
        - pause: { duration: 10s }
        - analysis:
            templates:
              - templateName: demo-prometheus-up
        - setWeight: 75
        - pause: { duration: 10s }
  template:
    metadata:
      labels:
        app: demo-app-analysis
    spec:
      containers:
        - name: nginx
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: demo-analysis-service
  namespace: demo
spec:
  type: ClusterIP
  selector:
    app: demo-app-analysis
  ports:
    - port: 80
      targetPort: 80
{{- end }}
