# Multi-arch image (works on amd64 and arm64). Pairs with an ephemeral
# Postgres sidecar defined in templates/deployment.yaml.
image: mattermost/mattermost-team-edition:release-9.11

admin:
  email: admin@lab.local
  username: admin
  # Password policy is relaxed via env vars on the deployment so this works.
  password: admin

team:
  name: lab
  displayName: Lab

channel:
  name: workflow-status
  displayName: Workflow Status

# Namespaces that get a copy of the `mattermost-creds` Secret created by
# the bootstrap Job. Add a namespace here whenever a new chart needs to
# post to Mattermost.
credsNamespaces:
- argo # Argo Workflows: mattermost-thread-demo + shop hook Workflows
