# The shop app: nginx serving a tiny page so you can prove a sync landed.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: shop-html
  namespace: shop
data:
  index.html: |
    <!doctype html>
    <html><head><title>Shop</title></head>
    <body style="font-family:sans-serif;padding:2em">
    <h1>🛒 Shop demo</h1>
    <p>Synced via Argo CD with PreSync migration + PostSync e2e tests, all
    threaded into Mattermost.</p>
    </body></html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop
  namespace: shop
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: shop
  template:
    metadata:
      labels:
        app: shop
    spec:
      containers:
        - name: shop
          image: {{ .Values.image }}
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
      volumes:
        - name: html
          configMap:
            name: shop-html
---
apiVersion: v1
kind: Service
metadata:
  name: shop
  namespace: shop
spec:
  selector:
    app: shop
  ports:
    - name: http
      port: {{ .Values.servicePort }}
      targetPort: 80
