# PostSync wave 1: sync succeeded. PostSync only runs when the sync
# itself completed Healthy, so reaching this Workflow is the signal
# we emit ":white_check_mark: sync ok" into the thread.
---
apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  name: shop-sync-status
  namespace: {{ .Values.hookNamespace }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  entrypoint: main
  serviceAccountName: {{ .Values.hookServiceAccount }}
  ttlStrategy:
    secondsAfterCompletion: 600
  templates:
    - name: main
      script:
        image: {{ include "mm-hooks.hookImage" . }}
        env: {{ include "mm-hooks.replyEnv" . | nindent 10 }}
        command: [sh]
        source: |
          set -eu
          {{ include "mm-hooks.statusFunc" . | nindent 10 }}
          {{ include "mm-hooks.replyFunc" . | nindent 10 }}

          update_status '[
            {"label":"DB Migration","status":"done"},
            {"label":"Sync Status","status":"done"},
            {"label":"End-To-End Tests","status":"pending"}
          ]'

          post_reply ":white_check_mark: Sync succeeded — Shop Deployment is Healthy"
