# PostSync wave 2: real e2e tests against the live Service. Submits a
# child Workflow from the playwright-e2e WorkflowTemplate (see
# charts/playwright-e2e-demo), waits for it, then posts pass/fail plus
# the MinIO report URL into the same Mattermost thread. As the terminal
# success-path hook it also deletes the thread ConfigMap.
---
apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  name: shop-e2e
  namespace: {{ .Values.hookNamespace }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  entrypoint: main
  serviceAccountName: {{ .Values.hookServiceAccount }}
  ttlStrategy:
    secondsAfterCompletion: 600
  templates:
    - name: main
      script:
        # Uses kubectlImage (not hookImage) because this hook submits a
        # child Workflow via kubectl and is also the terminal hook on the
        # success path responsible for cleaning up the thread ConfigMap.
        image: {{ include "mm-hooks.kubectlImage" . }}
        env:
          {{- include "mm-hooks.cleanupEnv" . | nindent 10 }}
        command: [sh]
        source: |
          set -eu
          {{ include "mm-hooks.statusFunc" . | nindent 10 }}

          update_status '[
            {"label":"DB Migration","status":"done"},
            {"label":"Sync Status","status":"done"},
            {"label":"End-To-End Tests","status":"running"}
          ]'

          TARGET="http://shop.shop.svc.cluster.local:{{ .Values.servicePort }}/"
          WF_NAME="shop-pw-$(date +%s)"
          echo "[shop] submitting playwright-e2e workflow $WF_NAME against $TARGET"

          cat <<YAML | kubectl -n "$NS" create -f -
          apiVersion: argoproj.io/v1alpha1
          kind: Workflow
          metadata:
            name: $WF_NAME
            labels:
              app: shop
              triggered-by: shop-e2e
          spec:
            workflowTemplateRef:
              name: playwright-e2e
            arguments:
              parameters:
                - name: target-url
                  value: "$TARGET"
          YAML

          # Poll: WorkflowTemplate runs can take several minutes (npm install
          # + browser tests). Cap at ~10 minutes.
          PHASE=""
          for i in $(seq 1 120); do
            PHASE=$(kubectl -n "$NS" get workflow "$WF_NAME" \
              -o jsonpath='{.status.phase}' 2>/dev/null || true)
            case "$PHASE" in
              Succeeded|Failed|Error) break ;;
            esac
            sleep 5
          done
          echo "[shop] playwright workflow $WF_NAME phase=$PHASE"

          REPORT_URL="http://localhost:9000/argo-artifacts/$WF_NAME/$WF_NAME/playwright-report/index.html"
          if [ "$PHASE" = "Succeeded" ]; then
            update_status '[
              {"label":"DB Migration","status":"done"},
              {"label":"Sync Status","status":"done"},
              {"label":"End-To-End Tests","status":"done"}
            ]' '#4CAF50'
            MSG=":test_tube: PostSync e2e (Playwright) passed → [HTML report]($REPORT_URL)"
          else
            update_status '[
              {"label":"DB Migration","status":"done"},
              {"label":"Sync Status","status":"done"},
              {"label":"End-To-End Tests","status":"failed"}
            ]' '#D32F2F'
            MSG=":rotating_light: PostSync e2e (Playwright) finished phase=$PHASE → [HTML report]($REPORT_URL)"
          fi

          body=$(jq -nc --arg c "$MM_CHANNEL" --arg m "$MSG" --arg r "$ROOT_ID" \
                  '{channel_id:$c,message:$m,root_id:$r}')
          curl -fsS -X POST "$MM_URL/api/v4/posts" \
            -H "Authorization: Bearer $MM_TOKEN" \
            -H 'Content-Type: application/json' \
            -d "$body" | jq -r '"[shop] reply id=" + .id'

          # Terminal hook on the success path: clean up the thread CM.
          {{ include "mm-hooks.cleanupCmd" . | nindent 10 }}

          [ "$PHASE" = "Succeeded" ] || exit 1
