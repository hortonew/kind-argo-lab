# PreSync wave -2: open a brand-new Mattermost thread for this sync,
# stash the parent post id (root_id) in a ConfigMap so every later
# stage (migration, sync status, e2e tests, syncfail) replies into it.
#
# Implemented as an Argo Workflow so it shows up in the Workflows UI
# alongside mattermost-thread-demo.
---
apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  name: shop-thread-start
  namespace: {{ .Values.hookNamespace }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  entrypoint: main
  serviceAccountName: {{ .Values.hookServiceAccount }}
  ttlStrategy:
    secondsAfterCompletion: 600
  templates:
    - name: main
      script:
        image: {{ .Values.kubectlImage }}
        env:
          - name: MM_URL
            valueFrom: { secretKeyRef: { name: mattermost-creds, key: url } }
          - name: MM_TOKEN
            valueFrom: { secretKeyRef: { name: mattermost-creds, key: token } }
          - name: MM_CHANNEL
            valueFrom: { secretKeyRef: { name: mattermost-creds, key: channel_id } }
          - name: NS
            value: {{ .Values.hookNamespace }}
          - name: THREAD_CM
            value: {{ .Values.threadConfigMap }}
        command: [sh]
        source: |
          set -eu
          MSG=":rocket: *Shop sync starting* — opening thread for migration → sync → e2e"
          body=$(jq -nc --arg c "$MM_CHANNEL" --arg m "$MSG" \
                  '{channel_id:$c,message:$m}')
          ROOT_ID=$(curl -fsS -X POST "$MM_URL/api/v4/posts" \
            -H "Authorization: Bearer $MM_TOKEN" \
            -H 'Content-Type: application/json' \
            -d "$body" | jq -r .id)
          echo "[shop] parent post id=$ROOT_ID"
          kubectl -n "$NS" create configmap "$THREAD_CM" \
            --from-literal=root_id="$ROOT_ID" \
            --dry-run=client -o yaml | kubectl apply -f -
          echo "[shop] root_id written to ConfigMap $NS/$THREAD_CM"
