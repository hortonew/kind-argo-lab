# PreSync wave -1: simulate a database migration. Replies into the
# thread opened by wave -2. If this Workflow fails, sync aborts and
# the SyncFail hook posts the failure reply.
---
apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  name: shop-migration
  namespace: {{ .Values.hookNamespace }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  entrypoint: main
  serviceAccountName: {{ .Values.hookServiceAccount }}
  ttlStrategy:
    secondsAfterCompletion: 600
  templates:
    - name: main
      script:
        image: {{ include "mm-hooks.hookImage" . }}
        env: {{ include "mm-hooks.replyEnv" . | nindent 10 }}
        command: [sh]
        source: |
          set -eu
          {{ include "mm-hooks.statusFunc" . | nindent 10 }}
          {{ include "mm-hooks.replyFunc" . | nindent 10 }}

          update_status '[
            {"label":"DB Migration","status":"running"},
            {"label":"Sync Status","status":"pending"},
            {"label":"End-To-End Tests","status":"pending"}
          ]'

          echo "[shop] running fake DB migration..."
          for i in 1 2 3; do echo "  applying migration $i"; sleep 1; done
          echo "[shop] migration done"

          update_status '[
            {"label":"DB Migration","status":"done"},
            {"label":"Sync Status","status":"pending"},
            {"label":"End-To-End Tests","status":"pending"}
          ]'

          post_reply ":hammer_and_wrench: PreSync migration complete (3 migrations applied)"
