# RBAC for hook Workflows running in {{ .Values.hookNamespace }}.
# Needs ConfigMap rw (to share Mattermost thread root_id between hooks)
# plus the standard workflow pod execution rights inherited from the
# argo-workflow ClusterRole created by the argo-workflows chart.
#
# These resources are themselves PreSync hooks at wave -3 so they exist
# before wave -2 (thread-start Workflow) tries to use the ServiceAccount.
# `hook-delete-policy: HookSucceeded` is omitted so the SA persists for
# subsequent syncs / PostSync waves / SyncFail.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.hookServiceAccount }}
  namespace: {{ .Values.hookNamespace }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-3"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.hookServiceAccount }}
  namespace: {{ .Values.hookNamespace }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-3"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
rules:
  # Thread-id ConfigMap.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  # Workflow controller writes pod logs / patches owning Workflow status;
  # the standard executor RBAC is provided by the argo-workflow SA, but
  # since we're using our own SA, mirror just enough for the executor.
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch", "create", "delete", "patch"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: ["argoproj.io"]
    resources: ["workflowtaskresults", "workflowtasksets", "workflowtasksets/status"]
    verbs: ["create", "get", "list", "watch", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.hookServiceAccount }}
  namespace: {{ .Values.hookNamespace }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-3"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
subjects:
  - kind: ServiceAccount
    name: {{ .Values.hookServiceAccount }}
    namespace: {{ .Values.hookNamespace }}
roleRef:
  kind: Role
  name: {{ .Values.hookServiceAccount }}
  apiGroup: rbac.authorization.k8s.io
