# SyncFail: only runs when the sync itself fails (e.g. PreSync migration
# crashed, or a manifest is invalid). Posts the failure into the thread
# opened by PreSync wave -2.
#
# Uses optional configMapKeyRef so the pod still starts if wave -2 itself
# failed before creating the thread ConfigMap; in that case we fall back
# to a top-level (un-threaded) post so the failure is still visible.
---
apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  name: shop-syncfail
  namespace: {{ .Values.hookNamespace }}
  annotations:
    argocd.argoproj.io/hook: SyncFail
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  entrypoint: main
  serviceAccountName: {{ .Values.hookServiceAccount }}
  ttlStrategy:
    secondsAfterCompletion: 600
  templates:
    - name: main
      script:
        image: {{ .Values.hookImage }}
        env: {{ include "shop.replyEnv" . | nindent 10 }}
        command: [sh]
        source: |
          set -eu
          MSG=":x: *Shop sync failed* — see Argo CD UI for details"
          if [ -n "${ROOT_ID:-}" ]; then
            body=$(jq -nc --arg c "$MM_CHANNEL" --arg m "$MSG" --arg r "$ROOT_ID" \
                    '{channel_id:$c,message:$m,root_id:$r}')
          else
            body=$(jq -nc --arg c "$MM_CHANNEL" --arg m "$MSG" \
                    '{channel_id:$c,message:$m}')
          fi
          curl -fsS -X POST "$MM_URL/api/v4/posts" \
            -H "Authorization: Bearer $MM_TOKEN" \
            -H 'Content-Type: application/json' \
            -d "$body" | jq -r '"[shop] failure post id=" + .id'
