# Shop demo app — a stand-in for "real" workload that runs through full
# GitOps lifecycle hooks (PreSync migrations, sync, PostSync e2e tests),
# posting every stage as a threaded Mattermost message.
#
# Hooks are Argo Workflows (not plain Jobs) so they show up in the Argo
# Workflows UI alongside the existing mattermost-thread-demo and you get
# DAG visualization, retries, artifacts, etc. for free.

# The "app" itself: nginx with a custom landing page so you can curl it.
image: nginx:stable-alpine

# Hook step images are provided by the mm-hooks library (see
# charts/_lib-mm-hooks/templates/_env.tpl). Override here if needed:
#   hookImage: badouralix/curl-jq:latest      # curl + jq only
#   kubectlImage: alpine/k8s:1.30.0           # adds kubectl

replicas: 1
servicePort: 80

# Hook Workflows live in the namespace where the Argo Workflows controller
# runs (it's namespace-scoped to `argo`). The shared thread-id ConfigMap
# lives there too.
hookNamespace: argo

# Name of the ConfigMap (in hookNamespace) that PreSync wave -2 creates
# and every later stage reads to recover the Mattermost thread root_id.
threadConfigMap: shop-mm-thread

# ServiceAccount the hook Workflows run as (created in templates/rbac.yaml
# in hookNamespace). Needs ConfigMap rw + workflow pod execution rights.
hookServiceAccount: shop-hooks

# Resource-name prefix for every hook Workflow + log prefix in script
# output. The mm-hooks library uses this to namespace its workflows.
hookNamePrefix: shop

# Steps shown in the parent-post status attachment. Thread-start renders
# them all as "Pending"; each hook PATCHes its own step to running/done.
statusSteps:
  - label: "DB Migration"
  - label: "Sync Status"
  - label: "End-To-End Tests"

# Toggle per-stage progress replies into the thread (e.g. "migration
# complete", "sync succeeded", e2e report URL). When false the parent
# attachment status card becomes the sole signal — the thread stays clean
# and only failure-path replies (SyncFail) appear in it. Failure replies
# always fire regardless of this setting.
threadStageReplies: true

# Messages posted by the mm-hooks library Workflows.
messages:
  threadStart: ":rocket: *Shop sync starting* — opening thread for migration → sync → e2e"
  syncFail: ":x: *Shop sync failed* — see Argo CD UI for details"
