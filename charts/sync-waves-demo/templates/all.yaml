# Full deploy chain demo, all hooks driven by Argo Workflows:
#   wave -1  PreSync   Workflow ref clusterworkflowtemplate/presync-migration
#   wave  0  Sync      ConfigMap + Service
#   wave  1  Sync      Deployment (depends on ConfigMap)
#   wave  2  PostSync  Workflow ref clusterworkflowtemplate/postsync-e2e
#
# Hooks live in the `argo` namespace because that is the only namespace the
# argo-workflows controller watches (charts/argo-workflows/values.yaml).
# ArgoCD tracks them by hookPhase regardless of namespace, and applies
# BeforeHookCreation so each new sync starts with a clean Workflow.
#
# Toggle .Values.failPreSync / .Values.failPostSync to exercise the failure
# path on demand.
---
apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  name: sync-waves-demo-presync
  namespace: argo
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
spec:
  serviceAccountName: argo-workflow
  workflowTemplateRef:
    name: presync-migration
    clusterScope: true
  arguments:
    parameters:
      - name: fail
        value: "{{ .Values.failPreSync | toString }}"
  ttlStrategy:
    secondsAfterCompletion: 300
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sync-waves-config
  namespace: sync-waves-demo
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  index.html: |
    <html><body><h1>hello from wave 0</h1></body></html>
---
apiVersion: v1
kind: Service
metadata:
  name: sync-waves-app
  namespace: sync-waves-demo
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  selector:
    app: sync-waves-app
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sync-waves-app
  namespace: sync-waves-demo
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sync-waves-app
  template:
    metadata:
      labels:
        app: sync-waves-app
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: content
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        - name: content
          configMap:
            name: sync-waves-config
            items:
              - key: index.html
                path: index.html
---
apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  name: sync-waves-demo-postsync
  namespace: argo
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "2"
spec:
  serviceAccountName: argo-workflow
  workflowTemplateRef:
    name: postsync-e2e
    clusterScope: true
  arguments:
    parameters:
      - name: fail
        value: "{{ .Values.failPostSync | toString }}"
  ttlStrategy:
    secondsAfterCompletion: 300
