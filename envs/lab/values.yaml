# Lab-environment overrides for charts/app-of-apps.
apps:
  demo-app:
    annotations:
      argocd-image-updater.argoproj.io/image-list: demo-app=localhost:5001/demo-app
      argocd-image-updater.argoproj.io/write-back-method: git
      argocd-image-updater.argoproj.io/git-branch: main
      argocd-image-updater.argoproj.io/demo-app.update-strategy: newest-build
      # Notifications: alertmanager subscription on failed sync
      notifications.argoproj.io/subscribe.on-sync-failed.alertmanager: ""
  sync-waves-demo:
    annotations:
      # Full chain: PreSync migration + Deploy + PostSync e2e.
      # Hook failures fail the whole sync → on-sync-failed fires.
      notifications.argoproj.io/subscribe.on-sync-succeeded.alertmanager: ""
      notifications.argoproj.io/subscribe.on-sync-failed.alertmanager: ""
